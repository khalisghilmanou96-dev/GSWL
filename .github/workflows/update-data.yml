name: GSWL hourly data engine
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: gswl-hourly-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query and validate official sources
        run: python scripts/update_data.py
      - name: Validate generated JSON
        run: |
          python -m json.tool data/salaries.json >/dev/null
          python -m json.tool data/alerts.json >/dev/null
          python -m json.tool data/source_health.json >/dev/null
      - name: Commit engine state
        run: |
          git config user.name "gswl-data-bot"
          git config user.email "gswl-data-bot@users.noreply.github.com"
          git add data/salaries.json data/alerts.json data/source_health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "GSWL hourly data refresh"
          git pull --rebase origin main
          git push origin main
